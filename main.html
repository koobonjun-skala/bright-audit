<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>/* 로그인하지 않았거나 1시간이 지나면 로그인 화면으로 */
(function(){ try { var a = JSON.parse(sessionStorage.getItem('bright-auth') || 'null'); if (!a || Date.now() - a.at >= 3600e3) { sessionStorage.removeItem('bright-auth'); location.replace('login.html'); } } catch (e) { location.replace('login.html'); } })();</script>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B:RIGHT · 수수료 감사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="orb.js?v=1794805836"></script>
<script src="bright-data.js?v=1794805836"></script>
<script src="bright-monthly.js?v=1794805836"></script>
<style>
:root{--ink:#14192B;--ink-2:#5A6178;--ink-3:#98A0B3;--line:#E6EAF3;--navy:#1B2550;--blue:#2F6BFF;--sky:#00B8FF;--glass:rgba(255,255,255,.66);--edge:rgba(255,255,255,.9);
  --red:#F4515A;--wine:#8E1B33;--yel:#F5B800;--yel-bg:#FFF6D6;--red-bg:#FFE9EA;--wine-bg:#F8E4E8;--green:#14915A;--green-bg:#E3F5EC;--blue-bg:#EAF0FF}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.015em}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;background:linear-gradient(135deg,#F3F6FD 0%,#EAF0FC 45%,#E4ECFC 100%)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px)}
.bg .a{width:780px;height:780px;right:-220px;top:-160px;background:radial-gradient(circle at 40% 40%,#B9CDFF 0%,#D3E0FF 45%,rgba(211,224,255,0) 70%)}
.bg .b{width:640px;height:640px;left:-200px;bottom:-280px;background:radial-gradient(circle,#CFDDFF 0%,rgba(207,221,255,0) 70%)}
.bg .s1{position:absolute;width:1400px;height:170px;left:-200px;top:300px;filter:blur(30px);transform:rotate(-32deg);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.8) 45%,rgba(255,255,255,0))}

/* ── 사이드바 */
.sb{position:fixed;z-index:30;left:16px;top:16px;bottom:16px;width:78px;display:flex;flex-direction:column;align-items:stretch;gap:12px;padding:14px 12px;border-radius:26px;overflow:hidden;
  background:var(--glass);border:1px solid var(--edge);box-shadow:0 18px 44px rgba(40,70,160,.08);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:width .38s cubic-bezier(.3,.8,.3,1),box-shadow .3s}
.sb.open{width:196px;box-shadow:0 24px 60px rgba(40,70,160,.16)}
.brand{position:relative;flex:none;height:52px;display:flex;align-items:center;border-radius:16px;cursor:pointer}
.brand .mk{position:absolute;left:8.5px;height:28px;transition:opacity .25s,transform .38s cubic-bezier(.3,.8,.3,1)}
.brand .full{position:absolute;left:14px;height:19px;opacity:0;transition:opacity .25s}
.sb.open .brand .mk{opacity:0;transform:translateX(-6px)}
.sb.open .brand .full{opacity:1;transition-delay:.12s}
.grp{flex:none;display:flex;flex-direction:column;gap:4px;padding:4px;border-radius:26px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9)}
.it{position:relative;display:flex;align-items:center;height:44px;min-width:44px;border-radius:22px;color:var(--ink-2);white-space:nowrap;overflow:hidden;transition:background .2s,color .2s;cursor:pointer}
.it .ic{flex:none;width:44px;height:44px;display:grid;place-items:center}
.it .ic svg{width:20px;height:20px}
.it .tx{font-size:14.5px;font-weight:600;opacity:0;transform:translateX(-4px);transition:opacity .2s,transform .3s}
.sb.open .it .tx{opacity:1;transform:none;transition-delay:.1s}
.it:hover{background:#EEF3FF;color:var(--ink)}
.it.on{background:var(--navy);color:#fff;box-shadow:0 8px 18px rgba(27,37,80,.25)}
.it.on .ic svg{color:#FFD23F}
/* 알림: 접힌 상태에서는 아이콘 오른쪽 위 작은 점, 펼치면 오른쪽 끝에 부드러운 숫자 */
.it .bd{position:absolute;left:28px;top:11px;width:8px;height:8px;padding:0;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #fff;font-size:0;color:transparent;
  display:flex;align-items:center;justify-content:center;transition:all .3s cubic-bezier(.3,.8,.3,1)}
.it.on .bd{box-shadow:0 0 0 2px var(--navy)}
.it .bd:empty{display:none}
.sb.open .it .bd{left:auto;right:10px;top:12px;width:auto;min-width:22px;height:20px;padding:0 7px;border-radius:10px;background:#FFE4E6;color:#D93A44;font-size:11px;font-weight:700;box-shadow:none;transition-delay:.08s}
.sb.open .it.on .bd{background:rgba(255,255,255,.16);color:#fff}
.botbtn{margin-top:auto;flex:none;display:flex;align-items:center;height:48px;margin-left:2px;margin-right:2px;border:0;padding:0;background:none;cursor:pointer;white-space:nowrap;overflow:hidden;border-radius:24px;color:var(--ink);transition:background .2s}
.botbtn:hover{background:rgba(255,255,255,.7)}
.botbtn .orb{flex:none;width:48px;height:48px}
.botbtn .tx{margin-left:10px;font-size:13.5px;font-weight:700;opacity:0;transition:opacity .2s}
.sb.open .botbtn .tx{opacity:1;transition-delay:.1s}

/* ── 본문 */
.main{position:relative;z-index:2;margin-left:104px;min-height:100vh;padding:22px 32px 18px 24px}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.hd h1{margin:0;white-space:nowrap;font-size:28px;font-weight:700;letter-spacing:-.035em}
.hd .sub{margin:3px 0 0;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.hd .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.role{display:flex;height:46px;padding:4px;border-radius:23px;background:#fff;box-shadow:0 6px 18px rgba(40,70,160,.06)}
.role button{border:0;background:none;padding:0 14px;border-radius:19px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.role button.on{background:var(--blue-bg);color:var(--blue)}
.sess{display:flex;align-items:center;gap:10px;height:46px;padding:0 6px 0 18px;border-radius:23px;background:var(--navy);color:#fff;font-size:13px}
.sess .tm{font-variant-numeric:tabular-nums;color:#9FC0FF;font-weight:600}
.sess button,.sess a{height:34px;padding:0 14px;border:0;border-radius:17px;background:rgba(255,255,255,.12);color:#fff;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center}
.sess button:hover,.sess a:hover{background:rgba(255,255,255,.22)}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#DCE6FF,#B9CCFF);display:grid;place-items:center;font-weight:800;color:var(--navy);box-shadow:0 0 0 3px #fff;flex:none}
.view{animation:vin .35s cubic-bezier(.3,.8,.3,1)}
@keyframes vin{from{opacity:0;transform:translateY(8px)}}

/* 공통 카드·버튼·뱃지 */
.card{border-radius:24px;background:rgba(255,255,255,.78);border:1px solid var(--edge);box-shadow:0 14px 36px rgba(40,70,160,.07);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.card-h{display:flex;align-items:center;gap:10px;padding:18px 22px 0}
.card-h h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em}
.card-h .x{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:19px;border:1px solid #DDE2EC;background:#fff;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:border-color .2s,color .2s,background .2s,box-shadow .2s}
.btn:hover{border-color:#B9C3D9;color:var(--ink)}
.btn.pri{border:0;background:var(--navy);color:#fff}
.btn.pri:hover{box-shadow:0 6px 16px rgba(27,37,80,.25)}
.btn.blue{border:0;background:linear-gradient(135deg,#3A86FF,#2F5BFF);color:#fff}
.btn.sm{height:30px;padding:0 12px;font-size:12.5px;border-radius:15px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.t-over{background:var(--red-bg);color:#D93A44}.t-under{background:var(--wine-bg);color:var(--wine)}.t-check{background:var(--yel-bg);color:#A27400}
.t-ok{background:var(--green-bg);color:var(--green)}.t-blue{background:var(--blue-bg);color:var(--blue)}.t-gray{background:#EEF0F5;color:var(--ink-2)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.seg{display:inline-flex;padding:4px;border-radius:20px;background:#fff;box-shadow:0 4px 12px rgba(40,70,160,.05)}
.seg button{border:0;background:none;height:30px;padding:0 13px;border-radius:15px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--navy);color:#fff}
.seg button small{margin-left:4px;font-weight:500;opacity:.7}
.inp{height:38px;padding:0 14px;border:1px solid #DDE2EC;border-radius:19px;background:#fff;outline:0}
.inp:focus{border-color:#9DB6F5;box-shadow:0 0 0 3px rgba(47,107,255,.1)}
.money{font-variant-numeric:tabular-nums}
.plus{color:#D93A44}.minus{color:var(--wine)}

/* ── 대시보드 */
.dash-hd{}
.row1{display:grid;grid-template-columns:198fr 337fr;gap:inherit}
.row2{display:grid;grid-template-columns:198fr 338fr;gap:inherit}
.kpis{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:clamp(10px,1.2vw,14px);aspect-ratio:198/189}
.kpi{position:relative;display:flex;flex-direction:column;padding:clamp(12px,1.3vw,18px);border-radius:22px;background:#fff;box-shadow:0 10px 26px rgba(40,70,160,.07);overflow:hidden;cursor:pointer;transition:background .25s,box-shadow .25s}
.kpi:hover{background:#EDF2FD;box-shadow:0 12px 28px rgba(40,70,160,.10)}
.kpi .ki{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:#EEF2FA;color:var(--ink-2);transition:background .25s}
.kpi:hover .ki{background:#DFE7F8}
.kpi .ki svg{width:18px;height:18px}
.kpi .kl{margin-top:auto;font-size:12.5px;color:var(--ink-2);font-weight:600}
.kpi .kv{font-size:clamp(20px,2vw,27px);font-weight:800;letter-spacing:-.04em;line-height:1.15}
.kpi .kv small{font-size:.5em;font-weight:600;color:var(--ink-3);margin-left:3px}
.kpi .ks{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:#EEF1F8}
.kpi .bar i{display:block;height:100%;background:#9AA9CF}
.kpi.dark{background:var(--navy);color:#fff}
.kpi.dark .kl{color:#B9C6EE}.kpi.dark .ks{color:#8E9BC6}.kpi.dark .kv small{color:#8E9BC6}

.res{position:relative;aspect-ratio:337/189;border-radius:26px;overflow:hidden;container-type:inline-size;
  background:radial-gradient(70% 90% at 75% 45%,#E9EFFF 0%,rgba(233,239,255,0) 60%),linear-gradient(145deg,#DCE5FB 0%,#CCD9F7 100%);box-shadow:0 18px 44px rgba(40,70,160,.10)}
.res h2{position:absolute;left:4.5cqw;top:4.6cqw;margin:0;font-size:3.4cqw;font-weight:700;line-height:1.28;letter-spacing:-.03em;color:var(--ink)}
.res .go{position:absolute;right:4cqw;top:4cqw;width:6.4cqw;height:6.4cqw;border-radius:1.8cqw;background:var(--navy);color:#FFD23F;display:grid;place-items:center;transition:transform .2s;cursor:pointer}
.res .go:hover{transform:scale(1.08)}
.res .go svg{width:45%;height:45%}
.lgd{position:absolute;left:4.5cqw;bottom:5cqw;display:flex;flex-direction:column;gap:1.7cqw}
.lgd a{display:flex;align-items:center;gap:2.2cqw;font-size:2.05cqw;color:var(--ink-2);cursor:pointer}
.lgd a:hover{color:var(--ink)}
.lgd i{width:5.4cqw;height:1.9cqw;border-radius:1cqw}
.lgd b{font-weight:700;color:var(--ink);margin-left:-1cqw}
.bub{position:absolute;border-radius:50%;display:grid;place-items:center;text-align:center;transform:translate(-50%,-50%);transition:transform .35s cubic-bezier(.3,1.4,.5,1),filter .3s;cursor:pointer}
.bub:hover{transform:translate(-50%,-50%) scale(1.05)}
.bub .v{position:relative;z-index:2;line-height:1.1}
.bub .v b{display:block;font-size:3.6cqw;font-weight:800;letter-spacing:-.03em}
.bub .v small{font-size:2cqw;font-weight:500;opacity:.8}
.bub.check{left:73.3%;top:47%;width:32cqw;height:32cqw;color:#5A4300;background:radial-gradient(circle at 50% 42%,#FFF0A8 0%,#FFE066 34%,#FFD23F 62%,rgba(255,210,63,.6) 80%,rgba(255,210,63,0) 100%);box-shadow:0 0 0 4.5cqw rgba(255,255,255,.32),0 0 4cqw 6.5cqw rgba(255,255,255,.28)}
.bub.over{left:52.2%;top:70%;width:20cqw;height:20cqw;color:#fff;background:radial-gradient(circle at 50% 45%,#FF8A80 0%,#F4515A 48%,rgba(244,81,90,.75) 72%,rgba(244,81,90,0) 100%);box-shadow:0 0 0 1.6cqw rgba(255,255,255,.3),0 0 2.5cqw 2.4cqw rgba(255,255,255,.25)}
.bub.under{left:47.5%;top:34.4%;width:13.7cqw;height:13.7cqw;color:#fff;background:radial-gradient(circle at 40% 35%,#C23B53 0%,#8E1B33 72%);box-shadow:0 0 0 1.2cqw rgba(255,255,255,.55),0 1.6cqw 3cqw rgba(142,27,51,.3)}
.res .tip{position:absolute;z-index:5;padding:.9cqw 1.6cqw;border-radius:1.4cqw;background:rgba(20,25,43,.88);color:#fff;font-size:1.8cqw;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-120%);transition:opacity .15s}
.slot{border-radius:26px;background:rgba(255,255,255,.42);border:1.5px dashed rgba(150,170,215,.45)}
.r2b{aspect-ratio:338/190}
.col{display:flex;flex-direction:column;gap:inherit}
.col .card{flex:1;min-height:0;overflow:hidden}
.row2>*{min-height:0}
.cl{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.cl div{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;min-width:0}
.cl div span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.cl div:hover span:last-child{color:var(--blue)}
.rank{padding:16px 20px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.rank-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rank-h h4{margin:0;font-size:15px;font-weight:700}
.rank-h .x{margin-left:auto;font-size:12px;color:var(--ink-3)}
.rtbl{width:100%;border-collapse:collapse;font-size:13px}
.rtbl th{text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-3);padding:6px 8px;border-bottom:1px solid var(--line)}
.rtbl td{padding:6px 8px;border-bottom:1px solid #F0F2F8}
.rtbl tbody tr{cursor:pointer;transition:background .2s}
.rtbl tbody tr:hover td{background:#F2F6FE}
.rtbl .z{color:#C5CBD8}
.mini{padding:14px 20px;display:flex;flex-direction:column;min-height:0}
.mini h4{margin:0;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.mini h4 .x{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink-3);cursor:pointer}
.mini h4 .x:hover{color:var(--blue)}
.spark{flex:1;min-height:40px;margin-top:4px}
.mini p{margin:6px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.rep{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.rep div{display:flex;align-items:center;gap:8px;font-size:12.5px}
.rep span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.rep b{font-variant-numeric:tabular-nums}
.flow{aspect-ratio:338/190;padding:18px 22px;display:flex;flex-direction:column}
.flow-h{display:flex;align-items:center;gap:10px}
.flow-h h4{margin:0;font-size:15px;font-weight:700}
.flow-h .x{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.fsteps{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:10px;margin-top:14px}
.fs{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:12px 14px;border-radius:16px;background:#F5F7FC;cursor:pointer;transition:background .2s,transform .2s}
.fs:hover{transform:translateY(-2px);background:#EEF3FF}
.fs .n{font-size:11.5px;font-weight:800;color:var(--ink-3)}
.fs b{font-size:13.5px;font-weight:700;line-height:1.3}
.fs small{font-size:11.5px;color:var(--ink-2)}
.fs .who{position:absolute;right:12px;top:11px;font-size:10.5px;font-weight:700;color:var(--ink-3)}
.fs.done{background:#EAF7F0}.fs.done .n{color:var(--green)}
.fs.now{background:var(--navy);color:#fff}.fs.now .n,.fs.now .who{color:#FFD23F}.fs.now small{color:#B9C6EE}
.fs .pb{height:4px;border-radius:2px;background:rgba(150,165,200,.25);overflow:hidden;margin-top:6px}
.fs .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--blue))}
.fs.now .pb{background:rgba(255,255,255,.18)}

/* ── 정책 관리 */
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.drop{margin:16px 22px 22px;padding:26px;border:2px dashed #C9D5F0;border-radius:20px;text-align:center;background:rgba(246,249,255,.6);transition:border-color .2s,background .2s}
.drop.over{border-color:var(--blue);background:#F0F5FF}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.drop small{color:var(--ink-3)}
.plist{padding:10px 14px 16px}
.prow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;transition:background .2s}
.prow:hover{background:#F5F7FC}
.prow .fi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none}
.prow .fi.docx{background:#3B6FE0}.prow .fi.xlsx,.prow .fi.xlsb{background:#1E8A52}
.prow .nm{flex:1;min-width:0}
.prow .nm b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm small{color:var(--ink-3);font-size:12px}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #C9D2E6;flex:none;display:grid;place-items:center;cursor:pointer}
.radio.on{border-color:var(--blue)}.radio.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue)}
.chg{padding:6px 14px 16px}
.chg-r{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:12px 10px;border-bottom:1px solid var(--line)}
.chg-r:last-child{border-bottom:0}
.chg-r b{font-size:13.5px}
.chg-r .was{font-size:12.5px;color:var(--ink-3);text-decoration:line-through;margin-top:3px}
.chg-r .now{font-size:12.5px;color:var(--ink);margin-top:2px}
.rules{padding:6px 14px 16px;max-height:520px;overflow:auto}
.rule{padding:12px 10px;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .top{display:flex;align-items:center;gap:8px}
.rule .top b{font-size:13.5px}
.rule p{margin:4px 0 0;font-size:12.5px;color:var(--ink-2)}

/* ── 근거 검토 */
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools .sp{flex:1}
.rv{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,44%);gap:18px;align-items:start}
.rv.nodet{grid-template-columns:1fr}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{position:sticky;top:0;z-index:1;background:#F6F8FD;padding:11px 12px;text-align:left;font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th:first-child{border-top-left-radius:16px}.tbl th:last-child{border-top-right-radius:16px}
.tbl th .ar{opacity:.4;margin-left:3px}
.tbl th.on .ar{opacity:1;color:var(--blue)}
.tbl td{padding:11px 12px;border-bottom:1px solid #EEF1F7;font-size:13px;vertical-align:middle}
.tbl tr.row{cursor:pointer;transition:background .15s}
.tbl tr.row:hover td{background:#F7F9FE}
.tbl tr.row.sel td{background:#EEF3FF}
.tbl .nm{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl .sm{font-size:11.5px;color:var(--ink-3)}
.rv:not(.nodet) .cx{display:none}
.tblwrap{max-height:calc(100vh - 230px);overflow:auto;border-radius:20px}
.ck{width:20px;height:20px;border-radius:6px;border:2px solid #C9D2E6;display:grid;place-items:center;cursor:pointer;background:#fff}
.ck.on{background:var(--blue);border-color:var(--blue)}
.ck.on::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-size:12.5px;color:var(--ink-3)}
.det{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;padding:22px}
.det-h{display:flex;align-items:flex-start;gap:10px}
.det-h h3{margin:4px 0 2px;font-size:19px;font-weight:700;letter-spacing:-.03em}
.det-h .x{margin-left:auto;border:0;background:none;font-size:22px;color:var(--ink-3);cursor:pointer;line-height:1}
.meta{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 14px;margin:14px 0;padding:14px 16px;border-radius:16px;background:#F6F8FD;font-size:12.5px}
.meta dt{color:var(--ink-3)}.meta dd{margin:0;font-weight:600}
.sec{margin-top:18px}
.sec h5{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--ink-2)}
.itbl{width:100%;border-collapse:collapse;font-size:12.5px}
.itbl th{text-align:left;font-weight:600;color:var(--ink-3);padding:6px 6px;border-bottom:1px solid var(--line)}
.itbl td{padding:8px 6px;border-bottom:1px solid #F0F2F8;vertical-align:top}
.itbl tr.bad td{background:#FFF6F6}.itbl tr.amb td{background:#FFFBEA}
.itbl .calc{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.why{padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.55}
.why.over{background:var(--red-bg)}.why.under{background:var(--wine-bg)}.why.check{background:var(--yel-bg)}
.quote{padding:14px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:12.5px;line-height:1.6;max-height:280px;overflow:auto}
.quote .src{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:11.5px;color:var(--ink-3)}
.quote mark{background:#FFF1A6;padding:0 2px;border-radius:3px}
.quote table{border-collapse:collapse;margin:6px 0;font-size:11.5px}
.quote td{border:1px solid #E3E7F0;padding:3px 7px;text-align:center}
.quote .lab{font-weight:700;margin-right:6px}
.ledger{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:#F6F8FD;font-size:12.5px}
.ledger b{font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.judge{display:flex;gap:6px}
.judge button{height:34px;padding:0 14px;border-radius:17px;border:1px solid #DDE2EC;background:#fff;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.judge button.on.j-over{background:var(--red-bg);border-color:transparent;color:#D93A44}
.judge button.on.j-ok{background:var(--green-bg);border-color:transparent;color:var(--green)}
.judge button.on.j-check{background:var(--yel-bg);border-color:transparent;color:#A27400}

/* ── 소명 요청 */
.ap{display:grid;grid-template-columns:minmax(0,1fr) minmax(420px,46%);gap:18px;align-items:start}
.reqs{padding:8px 12px 14px}
.req{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:16px;cursor:pointer;transition:background .2s}
.req:hover{background:#F5F7FC}.req.sel{background:#EEF3FF}
.req .nm{flex:1;min-width:0}
.req .nm b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.req .nm small{font-size:12px;color:var(--ink-3)}
.form{padding:22px}
.form h3{margin:0 0 16px;font-size:17px}
.fld{margin-bottom:14px}
.fld label{display:block;margin-bottom:6px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.fld .inp,.fld textarea,.fld select{width:100%}
.fld textarea{min-height:150px;padding:12px 14px;border:1px solid #DDE2EC;border-radius:16px;background:#fff;outline:0;resize:vertical;line-height:1.6}
.fld textarea:focus{border-color:#9DB6F5;box-shadow:0 0 0 3px rgba(47,107,255,.1)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border-radius:15px;background:#F1F4FA;font-size:12.5px}
.chip button{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:14px}
.ask3{display:flex;flex-direction:column;gap:6px}
.ask3 label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer}

/* ── 채팅 */
.ct{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;height:calc(100vh - 140px)}
.ct .card{display:flex;flex-direction:column;min-height:0}
.thr{flex:1;overflow:auto;padding:8px 10px 12px}
.th{display:flex;gap:10px;padding:12px;border-radius:16px;cursor:pointer;transition:background .2s}
.th:hover{background:#F5F7FC}.th.sel{background:#EEF3FF}
.th .av{width:40px;height:40px;font-size:14px;box-shadow:none}
.th .nm{flex:1;min-width:0}
.th .nm b{display:flex;align-items:center;gap:6px;font-size:13.5px}
.th .nm b em{font-style:normal;margin-left:auto;font-size:11px;font-weight:500;color:var(--ink-3)}
.th .nm small{display:block;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.conv-h b{font-size:15px}
.conv-h small{display:block;font-size:12px;color:var(--ink-3)}
.conv{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:72%;display:flex;flex-direction:column;gap:4px}
.msg .who{font-size:11.5px;color:var(--ink-3)}
.msg .bb{padding:11px 15px;border-radius:18px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;background:#fff;box-shadow:0 2px 8px rgba(40,70,160,.06);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bb{color:#fff;background:linear-gradient(135deg,#3A86FF,#2F5BFF);border-bottom-left-radius:18px;border-bottom-right-radius:6px}
.msg.sys{align-self:center;max-width:90%}
.msg.sys .bb{background:#F1F4FA;box-shadow:none;font-size:12.5px;color:var(--ink-2);border-radius:14px}
.att{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:#F3F6FC;font-size:12.5px;color:var(--ink);margin-top:4px}
.msg.me .att{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(40,70,160,.06)}
.att i{width:28px;height:28px;border-radius:8px;background:#1E8A52;color:#fff;font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center}
.composer{display:flex;align-items:flex-end;gap:10px;margin:0 16px 16px;padding:10px 10px 10px 16px;border-radius:20px;background:#fff;box-shadow:0 8px 22px rgba(40,70,160,.08)}
.composer textarea{flex:1;border:0;outline:0;resize:none;background:none;line-height:1.5;height:24px;max-height:120px;padding:4px 0;overflow:hidden}
.composer .clip{width:36px;height:36px;border:0;border-radius:50%;background:#F1F4FA;color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.pend{display:flex;flex-wrap:wrap;gap:6px;margin:0 16px 8px}

/* ── 최종 판단 */
.dc{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.dcard{padding:18px 20px;border-bottom:1px solid var(--line)}
.dcard:last-child{border-bottom:0}
.dtop{display:flex;align-items:center;gap:10px}
.dtop b{font-size:14.5px}
.dtop .x{margin-left:auto}
.dbody{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.dbox{padding:12px 14px;border-radius:14px;background:#F6F8FD;font-size:12.5px;line-height:1.55}
.dbox h6{margin:0 0 4px;font-size:11.5px;color:var(--ink-3);font-weight:700}
.dfoot{display:flex;align-items:center;gap:10px;margin-top:12px}
.dfoot input{flex:1}
.close{padding:22px;position:sticky;top:20px}
.ring{position:relative;width:150px;height:150px;margin:6px auto 14px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:800}
.ring b small{display:block;font-size:12px;font-weight:600;color:var(--ink-3);text-align:center}
.hist{margin-top:16px}
.hist div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}

/* ── 현상 분석 */
.tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.tr .wide{grid-column:1/-1}
.chart{padding:8px 22px 20px}
.chart svg{display:block;width:100%;height:auto}
.note{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#A27400;background:var(--yel-bg);padding:3px 9px;border-radius:10px}
.cmts{display:flex;flex-direction:column;gap:10px;padding:14px 22px 22px}
.cmt{display:flex;gap:12px;padding:14px 16px;border-radius:16px;background:#F6F8FD;font-size:13.5px;line-height:1.6}
.cmt .orb{flex:none;width:28px;height:28px}
.cmt b{color:var(--blue)}
.reptbl td,.reptbl th{font-size:12.5px}

/* ── 도우미 대화 패널 */
.chat{position:fixed;z-index:25;left:104px;top:16px;bottom:16px;width:min(620px,calc(50vw - 110px));display:flex;flex-direction:column;border-radius:26px;background:rgba(255,255,255,.9);border:1px solid var(--edge);box-shadow:0 24px 60px rgba(40,70,160,.16);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transform:translateX(-16px) scale(.98);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.3,.8,.3,1),opacity .25s}
.chat.open{transform:none;opacity:1;pointer-events:auto}
.chat-h{height:62px;display:flex;align-items:center;gap:10px;padding:0 14px 0 20px;font-weight:700}
.chat-h .orb{width:30px;height:30px}
.chat-h button{margin-left:auto;width:32px;height:32px;border:0;border-radius:50%;background:transparent;font-size:20px;color:var(--ink-3);cursor:pointer}
.chat-h button:hover{background:#fff}
.msgs{flex:1;overflow:auto;padding:6px 20px 16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:86%;padding:11px 15px;border-radius:18px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.m.u{align-self:flex-end;color:#fff;background:linear-gradient(135deg,#3A86FF,#2F5BFF);border-bottom-right-radius:6px}
.m.b{align-self:flex-start;background:#fff;border-bottom-left-radius:6px;box-shadow:0 2px 8px rgba(40,70,160,.06)}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 10px}
.sugg button{height:30px;padding:0 12px;border-radius:15px;border:1px solid #DDE2EC;background:#fff;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.sugg button:hover{border-color:var(--blue);color:var(--blue)}
.ask{margin:0 14px 14px;display:flex;align-items:flex-end;gap:10px;padding:12px 12px 12px 18px;border-radius:20px;background:#fff;box-shadow:0 10px 26px rgba(40,70,160,.08)}
.ask textarea{flex:1;border:0;outline:0;resize:none;background:none;font-size:14.5px;line-height:1.5;height:24px;max-height:120px;padding:2px 0;overflow:hidden}
.ask textarea::placeholder{color:var(--ink-2)}
.ask textarea:focus::placeholder{color:transparent}
.send{position:relative;flex:none;width:36px;height:36px;border:0;border-radius:50%;background:#E3E7EF;color:#fff;overflow:hidden;padding:0;cursor:not-allowed}
.send .fill{position:absolute;inset:auto 0 0;height:0;background:linear-gradient(180deg,var(--sky),var(--blue));transition:height .45s cubic-bezier(.3,.8,.3,1)}
.send.on{cursor:pointer;box-shadow:0 4px 12px rgba(47,107,255,.35)}.send.on .fill{height:100%}
.send svg{position:relative;z-index:1;display:block;margin:auto}

/* 토스트 */
#toast{position:fixed;left:50%;bottom:28px;z-index:60;transform:translate(-50%,12px);padding:11px 18px;border-radius:12px;background:rgba(20,25,43,.9);color:#fff;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* 첫 화면에서 넘어올 때 */
.intro .brand,.intro .grp,.intro .hd,.intro .view{opacity:0;transform:translateY(10px);animation:in .55s cubic-bezier(.3,.8,.3,1) forwards}
.intro .grp:nth-of-type(1){animation-delay:.08s}.intro .grp:nth-of-type(2){animation-delay:.14s}
.intro .hd{animation-delay:.12s}.intro .view{animation-delay:.22s}
.intro .bub{animation:grow .7s cubic-bezier(.3,1.4,.5,1) both}
.intro .bub.under{animation-delay:.55s}.intro .bub.over{animation-delay:.45s}.intro .bub.check{animation-delay:.35s}
@keyframes in{to{opacity:1;transform:none}}
@keyframes grow{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}}

/* ── 대시보드: 한 화면 높이에 고정 (화면을 넓혀도 아래로 길어지지 않게) */
.board{width:100%;max-width:none;height:calc(100vh - 124px);min-height:560px;display:grid;grid-template-rows:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.row1,.row2{display:grid;grid-template-columns:198fr 337fr;gap:16px;min-height:0;height:auto}
.kpis{aspect-ratio:auto;height:100%;min-height:0;gap:14px}
.kpi{padding:18px 20px}
.kpi .ki{width:38px;height:38px;border-radius:12px}
.kpi .kl{font-size:13.5px}
.kpi .kv{font-size:clamp(26px,2.3vw,34px);margin-top:2px}
.kpi .ks{font-size:12.5px;margin-top:2px}
.res{aspect-ratio:auto;height:100%;min-height:0;container-type:size}
.res h2{left:24px;top:22px;font-size:20px}
.res .go{right:20px;top:20px;width:38px;height:38px;border-radius:12px}
.lgd{left:24px;bottom:22px;gap:10px}
.lgd a{font-size:13.5px;gap:10px}
.lgd i{width:28px;height:10px;border-radius:5px}
.lgd b{margin-left:-4px}
.bub{--s:min(calc(var(--d) * 1cqw),calc(var(--d) * 1.78cqh));width:var(--s)!important;height:var(--s)!important}
.bub .v b{font-size:clamp(14px,calc(var(--s) * .2),34px)}
.bub .v small{font-size:clamp(10px,calc(var(--s) * .1),15px)}
.bub.check{box-shadow:0 0 0 calc(var(--s) * .14) rgba(255,255,255,.32),0 0 calc(var(--s) * .12) calc(var(--s) * .2) rgba(255,255,255,.28)}
.bub.over{box-shadow:0 0 0 calc(var(--s) * .08) rgba(255,255,255,.3),0 0 calc(var(--s) * .12) calc(var(--s) * .12) rgba(255,255,255,.25)}
.bub.under{box-shadow:0 0 0 calc(var(--s) * .09) rgba(255,255,255,.55),0 calc(var(--s) * .1) calc(var(--s) * .2) rgba(142,27,51,.3)}
.res .tip{padding:6px 10px;border-radius:8px;font-size:12px}
.cbox{padding:16px 18px;display:flex;flex-direction:column;min-height:0}
.cbox-h{display:flex;align-items:center;gap:8px}
.cbox-h h4{margin:0;font-size:15px;font-weight:700}
.cbox-h .x{margin-left:auto;font-size:12px;color:var(--ink-3);cursor:pointer}
.cbox-h .x:hover{color:var(--blue)}
.crows{flex:1;display:flex;flex-direction:column;gap:6px;margin-top:10px;min-height:0}
.crow{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left;border:0;border-radius:14px;padding:6px 14px;background:#F6F8FD;cursor:pointer;transition:background .2s}
.crow:hover{background:#E8EEFB}
.crow.on{background:#DCE6FA}
.crow .kd{font-size:11.5px;font-weight:700;color:var(--ink-3)}
.crow b{font-size:13.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:40px}
.crow .lv{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:11px;font-weight:700;color:var(--blue)}
.crow .lv.w{color:#D93A44}
.cchart{padding:16px 20px 12px;display:flex;flex-direction:column;min-height:0}
.cc-h{display:flex;align-items:center;gap:10px;min-width:0}
.cc-h h4{margin:0;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-h .x{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap}
.cc-b{flex:1;min-height:0;margin-top:6px}
.cc-b svg{display:block;width:100%;height:100%}
/* ── 현상 코멘트 화면: 종류별로 나눠 보기 */
.cv{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start}
.cl2{padding:10px;display:flex;flex-direction:column;gap:4px}
.ci2{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:0;background:transparent;border-radius:16px;padding:14px;cursor:pointer;transition:background .2s}
.ci2:hover{background:#F2F6FE}
.ci2.on{background:#E3EBFB}
.ci2 b{font-size:14px;line-height:1.45;color:var(--ink)}
.ci2 small{font-size:12px;color:var(--ink-3)}
.cd2{padding:24px 28px}
.cd2 h3{margin:12px 0 12px;font-size:21px;font-weight:700;letter-spacing:-.03em}
.cd2-b{display:flex;gap:10px;align-items:flex-start;margin:0;padding:14px 16px;border-radius:16px;background:#F6F8FD;font-size:14px;line-height:1.7;color:var(--ink-2)}
.cd2-b .orb{flex:none;width:26px;height:26px}
.cd2-c{margin-top:18px}
.cd2-c svg{display:block;width:100%;height:auto}
.cd2-f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:12px;color:var(--ink-3)}
.ck{transition:background .2s,border-color .2s}
.ck.pop{animation:ckpop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes ckpop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.tbl tr.just td{background:#EAF7F0!important;transition:background .3s}
.tblwrap{max-height:calc(100vh - 210px)}
/* ── 정책 관리: 쌓인 정책 + 비교 */
.pg2{display:grid;grid-template-columns:400px minmax(0,1fr);gap:18px;align-items:start}
.pcol{display:flex;flex-direction:column;gap:18px}
.pcol .plist{max-height:calc(100vh - 260px);overflow:auto}
.prow{cursor:pointer}
.prow.cur{background:#EEF3FF}
.cmp{min-height:calc(100vh - 140px)}
.pick{display:flex;align-items:flex-end;gap:12px;padding:16px 22px 6px;flex-wrap:wrap}
.pick label{display:flex;flex-direction:column;gap:6px;flex:1;min-width:220px}
.pick label span{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.pick select{width:100%}
.pick .arrow{padding-bottom:9px;font-size:18px;color:var(--ink-3)}
.cmp-note{margin:4px 22px 0;font-size:12.5px;color:var(--ink-3)}
.sumc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 22px 6px}
.sumc div{padding:14px 16px;border-radius:16px;background:#F6F8FD}
.sumc b{display:block;font-size:26px;font-weight:800;letter-spacing:-.03em}
.sumc span{font-size:12.5px;color:var(--ink-2)}
.sumc .mute b{color:var(--ink-3)}
.dlist{padding:6px 22px 4px}

/* ── 나뉜 화면은 칸 높이를 화면에 맞추고, 같은 줄은 같은 크기로 */

/* 위반목록 도넛 */

/* 판정 근거 단계 */
.why.head{display:flex;flex-direction:column;gap:4px;padding:14px 16px}

.cl-tb td.paid{background:#FFEDEE!important;color:#B4232E;font-weight:800;box-shadow:inset 0 0 0 2px #F4515A;border-radius:6px}
.cl-tb td{position:relative}
.ctag{display:block;width:max-content;margin:3px auto 0;padding:0 6px;border-radius:6px;font-style:normal;font-size:10.5px;font-weight:800;line-height:16px;color:#fff}
.ctag.on{background:#4F7BFF}.ctag.paid{background:#F4515A}
.cl-lg{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--ink-3)}
.cl-lg span{display:inline-flex;align-items:center;gap:6px}
.cl-lg .sw{width:14px;height:10px;border-radius:3px;display:inline-block}
.cl-lg .sw.on{background:#E6EEFF;box-shadow:inset 0 0 0 2px #4F7BFF}.cl-lg .sw.paid{background:#FFEDEE;box-shadow:inset 0 0 0 2px #F4515A}
.cl-diff{padding:11px 13px;border-radius:12px;background:#FFF4F4;border:1px solid #FFD9DB}
.cl-diff em{display:block;font-style:normal;font-size:11.5px;font-weight:800;color:#C2333C;margin-bottom:3px}
.cl-diff p{margin:0;font-size:13.5px;line-height:1.65;color:var(--ink)}
.cl-cmp{border-style:dashed;border-color:#F4A4A9;background:#FFFCFC}
.cl-cmp-h{font-size:11.5px;font-weight:800;color:#C2333C}
.cl-rest summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--blue);list-style:none;width:max-content}
.cl-rest summary::-webkit-details-marker{display:none}
.cl-rest summary::after{content:' ›'}.cl-rest[open] summary::after{content:' ‹'}
.cl-rest .cl-tbs{margin-top:8px}
.cl-diff.q{background:#FFF8E6;border-color:#FBE3A6}.cl-diff.q em{color:#8A6200}
.cl-diff{display:block!important}.cl-diff em{display:block!important;width:auto!important}

/* 원문 맥락 */
.cl-ph{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;border-radius:10px;background:#F6F8FD;font-size:12px;color:var(--ink-3)}
.cl-ph b{color:var(--ink);font-weight:700;margin-left:4px}
.cl-base{padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;line-height:1.6;color:var(--ink-2)}
.cl-base em{display:block;font-style:normal;font-size:11.5px;font-weight:800;color:var(--ink-3);margin-bottom:4px}
.cl-base div.on{color:var(--ink);font-weight:700;background:#FFF1B8;border-radius:6px;padding:0 6px;margin-left:-6px;width:fit-content}
.cl-sib{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:8px 0 0;font-size:12.5px;line-height:1.55}
.cl-sib dt{color:var(--ink-3);font-weight:700}.cl-sib dd{margin:0;color:var(--ink-2)}
.cl-rel{padding:10px 12px;border-radius:10px;background:#F7F9FE}
.cl-rel em{display:block;font-style:normal;font-size:11.5px;font-weight:800;color:#2F56C9;margin-bottom:6px}
.cl-rel ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.cl-rel li span{display:block;font-size:11.5px;font-weight:700;color:var(--ink-3)}
.cl-rel li p{margin:2px 0 0;font-size:12.5px;line-height:1.6;color:var(--ink)}
.cl-rel mark{background:#FFE58A;border-radius:3px;padding:0 2px}

/* 소명 검토 · 메일함 */
.mb{display:grid;grid-template-columns:208px 360px minmax(0,1fr);gap:16px;height:calc(100vh - 128px)}
.mb>.card{min-height:0;display:flex;flex-direction:column;overflow:hidden}
.mb-f{padding:14px 10px;gap:4px}
.mb-new{justify-content:center;margin:0 4px 12px;height:42px;border-radius:14px}
.mb-fi{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border:0;border-radius:12px;background:none;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;text-align:left}
.mb-fi svg{flex:none;color:var(--ink-3)}
.mb-fi span{flex:1}
.mb-fi em{font-style:normal;font-size:12px;color:var(--ink-3)}
.mb-fi em b{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--blue);color:#fff;font-size:11.5px}
.mb-fi:hover{background:#F2F6FE}
.mb-fi.on{background:#E3EBFB;color:var(--ink)}.mb-fi.on svg{color:var(--blue)}
.mb-lh{display:flex;align-items:baseline;justify-content:space-between;padding:18px 18px 10px;border-bottom:1px solid var(--line)}
.mb-lh h3{margin:0;font-size:16px;font-weight:800}
.mb-lh span{font-size:12px;color:var(--ink-3)}
.mb-items{flex:1;overflow:auto}
.mi{display:flex;flex-direction:column;gap:3px;width:100%;padding:13px 18px;border:0;border-bottom:1px solid #F0F2F7;background:none;text-align:left;cursor:pointer;position:relative}
.mi:hover{background:#F7F9FE}
.mi.on{background:#EDF2FD}
.mi.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.mi-t{display:flex;align-items:center;gap:8px}
.mi-t b{flex:1;font-size:13.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi-t time{font-size:11.5px;color:var(--ink-3)}
.mi-s{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi-s .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.mi-p{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi-f{display:flex;align-items:center;gap:8px;margin-top:4px}
.mi-f .tag{font-size:11px}
.mi-clip{display:inline-flex;color:var(--ink-3)}
.mi-due{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.mi.unread .mi-t b,.mi.unread .mi-s{font-weight:800}
.mb-empty{padding:40px 16px;text-align:center;font-size:13px;color:var(--ink-3)}
.mb-empty.big{margin:auto}
.rd-h{padding:20px 24px 14px;border-bottom:1px solid var(--line)}
.rd-h h2{margin:0 0 8px;font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.4}
.rd-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12.5px;color:var(--ink-3)}
.rd-b{flex:1;overflow:auto;padding:16px 24px 20px;display:flex;flex-direction:column;gap:10px}
.ml{border:1px solid var(--line);border-radius:14px;background:#fff}
.ml header{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.ml .av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;box-shadow:none}
.ml .av.aud{background:var(--navy);color:#fff}.ml .av.pay{background:#E3EBFB;color:#2F56C9}
.ml-from{flex:1;min-width:0}
.ml-from b{display:block;font-size:13.5px;color:var(--ink)}
.ml-from small{display:block;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ml-clip{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--ink-3)}
.ml time{font-size:12px;color:var(--ink-3);white-space:nowrap}
.ml:not(.open){background:#FAFBFD}
.ml-body{padding:4px 16px 16px 62px;font-size:14px;line-height:1.75;color:var(--ink);white-space:pre-wrap}
.ml-att{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 16px 62px}
.rd-j{margin-top:6px;border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.rd-jh{display:flex;align-items:baseline;justify-content:space-between}
.rd-jh h4{margin:0;font-size:14px;font-weight:800}.rd-jh span{font-size:12px;color:var(--ink-3)}
.rj{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 14px;border-radius:12px;background:#F7F9FE}
.rj-t{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:0}
.rj-t b{font-size:13.5px}.rj-t small{width:100%;font-size:12px;color:var(--ink-3)}
.rj .inp{grid-column:1/-1;width:100%}
.rd-j>.btn{align-self:flex-end}
.rd-done{padding:10px 12px;border-radius:10px;background:#EAF7EF;color:#1E7A43;font-size:12.5px;font-weight:600;text-align:center}
.rd-rb{padding:12px 24px 16px;border-top:1px solid var(--line)}
.rd-c{border-top:1px solid var(--line);padding:12px 24px 16px;display:flex;flex-direction:column;gap:6px}
.rd-cf{display:flex;gap:12px;font-size:12.5px;padding:4px 0;border-bottom:1px solid #F0F2F7}
.rd-cf span{width:64px;color:var(--ink-3)}.rd-cf b{font-weight:600;color:var(--ink)}
.rd-c textarea{min-height:110px;max-height:220px;resize:vertical;border:0;outline:0;padding:10px 0;font:inherit;font-size:14px;line-height:1.7;color:var(--ink);background:none}
.rd-ca{display:flex;align-items:center;gap:8px}

/* 메일함: 편지함을 상단 가로 막대로 */
.mb{grid-template-columns:360px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:14px 16px}
.mb>.mb-f{grid-column:1/-1;flex-direction:row;align-items:center;gap:6px;padding:8px;overflow:visible}
.mb-f .mb-fi{height:40px;padding:0 16px;flex:none}
.mb-f .mb-fi span{flex:none}
.mb-f .mb-fi em{margin-left:6px}
.mb-f .mb-new{order:9;margin:0 0 0 auto;height:40px;padding:0 18px}

/* 탭·토글 버튼 통일 (메일함 편지함 버튼 모양 기준) */
.seg,.role{display:inline-flex;align-items:center;gap:4px;padding:6px;border-radius:18px;background:#fff;box-shadow:0 10px 26px rgba(40,70,160,.07);height:auto}
.seg button,.role button,.mb-fi{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:0;border-radius:12px;background:none;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover,.role button:hover,.mb-fi:hover{background:#F2F6FE}
.seg button.on,.role button.on,.mb-fi.on{background:#E3EBFB;color:var(--ink)}
.seg button small{margin-left:0;font-size:12px;font-weight:600;color:var(--ink-3);opacity:1}
.role button{height:36px}
.lone .lt .seg{display:flex;background:#fff;box-shadow:none;padding:0}
.lone .lt .seg button{flex:1;justify-content:center}
</style>
</head>
