<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B:RIGHT · 로그인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="orb.js"></script>
<style>
:root{--ink:#14192B;--ink-2:#5A6178;--ink-3:#9AA1B4;--blue:#2F6BFF;--navy:#1B2550}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.02em}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;background:linear-gradient(135deg,#F3F6FD 0%,#EAF0FC 45%,#E4ECFC 100%)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px)}
.bg .a{width:780px;height:780px;right:-220px;top:-160px;background:radial-gradient(circle at 40% 40%,#B9CDFF 0%,#D3E0FF 45%,rgba(211,224,255,0) 70%);animation:drift 18s ease-in-out infinite alternate}
.bg .b{width:640px;height:640px;left:-200px;bottom:-280px;background:radial-gradient(circle,#CFDDFF 0%,rgba(207,221,255,0) 70%);animation:drift 22s ease-in-out infinite alternate-reverse}
.bg .s1{position:absolute;width:1400px;height:170px;left:-200px;top:300px;filter:blur(30px);transform:rotate(-32deg);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.85) 45%,rgba(255,255,255,0))}
@keyframes drift{to{transform:translate(-40px,30px) scale(1.06)}}

.card{position:relative;z-index:2;width:420px;padding:44px 40px 32px;border-radius:30px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);
  box-shadow:0 30px 80px rgba(40,70,160,.14);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);text-align:center;animation:up .6s cubic-bezier(.3,.8,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.orb{width:64px;height:64px;margin:0 auto 18px}
.logo svg{height:26px;width:auto}
h1{margin:18px 0 6px;font-size:24px;font-weight:700;letter-spacing:-.035em}
.sub{margin:0 0 28px;font-size:14.5px;line-height:1.6;color:var(--ink-2)}
.g{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:52px;border:1px solid #DADCE0;border-radius:26px;background:#fff;font-family:inherit;font-size:15px;font-weight:600;color:#1F1F1F;cursor:pointer;transition:box-shadow .2s,border-color .2s}
.g:hover{border-color:#C6CBD4;box-shadow:0 6px 18px rgba(40,70,160,.10)}
.g svg{width:20px;height:20px}
.g.busy{pointer-events:none;color:var(--ink-3)}
.g.busy svg{display:none}
.g.busy::before{content:"";width:18px;height:18px;border-radius:50%;border:2px solid #DCE3F2;border-top-color:var(--blue);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.notes{margin:24px 0 0;padding:16px 0 0;border-top:1px solid rgba(160,175,210,.3);list-style:none;text-align:left;font-size:12.5px;line-height:1.7;color:var(--ink-3)}
.notes li{display:flex;gap:8px}
.notes li::before{content:"·";color:var(--ink-3)}
.err{min-height:20px;margin:12px 0 0;font-size:13px;color:#D93A44}

/* Google 계정 선택 */
.dim{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:rgba(20,25,43,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.dim.on{display:grid;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.pick{width:380px;border-radius:24px;background:#fff;box-shadow:0 30px 80px rgba(20,30,70,.25);overflow:hidden;animation:up .3s cubic-bezier(.3,.8,.3,1)}
.pick-h{padding:28px 28px 16px;text-align:center}
.pick-h svg{width:26px;height:26px}
.pick-h b{display:block;margin-top:10px;font-size:19px;font-weight:600}
.pick-h small{display:block;margin-top:4px;font-size:13.5px;color:var(--ink-2)}
.acc{display:flex;align-items:center;gap:14px;width:100%;padding:14px 28px;border:0;border-top:1px solid #EEF0F4;background:#fff;font-family:inherit;text-align:left;cursor:pointer;transition:background .15s}
.acc:hover{background:#F5F7FB}
.acc .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,#5B86FF,#2F5BE0);flex:none}
.acc .av.o{background:#EEF1F6;color:var(--ink-2)}
.acc b{display:block;font-size:14.5px;font-weight:600;color:var(--ink)}
.acc small{font-size:12.5px;color:var(--ink-2)}
.pick-f{display:flex;justify-content:space-between;align-items:center;padding:14px 20px 16px 28px;border-top:1px solid #EEF0F4;font-size:12px;color:var(--ink-3)}
.pick-f button{border:0;background:none;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--blue);cursor:pointer;padding:8px 10px;border-radius:10px}
.pick-f button:hover{background:#F2F6FE}
.leave{animation:out .45s ease forwards}
@keyframes out{to{opacity:0;transform:translateY(-10px) scale(.98)}}
</style>
</head>
<body>
<div class="bg"><i class="a"></i><i class="b"></i><i class="s1"></i></div>

<main class="card" id="card">
  <span class="orb" data-orb></span>
  <div class="logo"><svg viewBox="36 22 504 98" role="img" aria-label="B:RIGHT"><defs><radialGradient id="g"><stop offset="0" stop-color="#FFD23F" stop-opacity="0.7"/><stop offset="0.42" stop-color="#FFD23F" stop-opacity="0.35"/><stop offset="0.7" stop-color="#FFD23F" stop-opacity="0.1"/><stop offset="1" stop-color="#FFD23F" stop-opacity="0"/></radialGradient></defs><path transform="translate(40.00 40.00) scale(0.25168)" fill="#1A1A1A" fill-rule="evenodd" d="M0 0H178C219 0 252 34 252 78C252 105 243 125 230 140C251 152 263 178 263 208C263 258 225 298 178 298H0Z M0 68H168C179 68 183 80 183 93C183 108 174 118 160 118H72V82L0 117Z M71 172H160C177 172 188 186 188 202C188 218 177 231 160 231H71Z"/><circle cx="132.44" cy="50.00" r="24.00" fill="url(#g)"/><circle cx="132.44" cy="50.00" r="10.00" fill="#FFD23F"/><circle cx="132.44" cy="105.00" r="8.50" fill="none" stroke="#B4A8F5" stroke-width="3.00"/><path fill="#1A1A1A" d="M179.14 88.0V115.0H158.44V40.0H202.94Q211.54 40.0 217.94 43.05Q224.34 46.1 227.94 51.45Q231.54 56.8 231.54 64.1Q231.54 71.2 227.94 76.6Q224.34 82.0 217.94 85.0Q215.44 86.2 212.64 86.9L234.14 115.0H210.14L189.94 88.0ZM179.14 72.8H200.04Q205.04 72.8 207.84 70.5Q210.64 68.2 210.64 64.1Q210.64 59.9 207.84 57.65Q205.04 55.4 200.04 55.4H179.14Z M241.44 40.0H262.14V115.0H241.44Z M318.34 90.8V76.2H358.14V115.0H343.44L342.44 104.9Q341.84 105.7 341.14 106.4Q336.44 111.2 329.49 113.9Q322.54 116.6 313.34 116.6Q304.54 116.6 296.84 114.05Q289.14 111.5 283.29 106.5Q277.44 101.5 274.19 94.2Q270.94 86.9 270.94 77.5Q270.94 68.1 274.24 60.8Q277.54 53.5 283.49 48.5Q289.44 43.5 297.29 40.95Q305.14 38.4 314.44 38.4Q326.84 38.4 335.84 42.2Q344.84 46.0 350.34 52.6Q355.84 59.2 357.44 67.9H336.54Q335.54 64.1 332.49 61.35Q329.44 58.6 324.89 57.15Q320.34 55.7 314.54 55.7Q307.54 55.7 302.44 58.15Q297.34 60.6 294.54 65.45Q291.74 70.3 291.74 77.5Q291.74 84.8 294.74 89.8Q297.74 94.8 303.29 97.3Q308.84 99.8 316.34 99.8Q323.64 99.8 329.24 97.75Q334.84 95.7 338.24 91.7Q338.54 91.3 338.94 90.8Z M368.54 40.0H389.24V67.7H427.54V40.0H448.34V115.0H427.54V86.1H389.24V115.0H368.54Z M455.24 40.0H533.24V58.4H504.64V115.0H483.84V58.4H455.24Z"/></svg></div>
  <h1>수수료 감사를 시작해요</h1>
  <p class="sub">등록된 Google 계정으로 로그인하세요.</p>
  <button class="g" id="gbtn" type="button">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Google 계정으로 로그인
  </button>
  <p class="err" id="err"></p>
  <ul class="notes">
    <li>미리 등록한 감사 담당자 계정만 로그인할 수 있어요.</li>
    <li>로그인은 1시간 유지되고, 화면 위쪽 [연장]으로 늘릴 수 있어요.</li>
  </ul>
</main>

<div class="dim" id="dim" role="dialog" aria-label="Google 계정 선택">
  <div class="pick">
    <div class="pick-h"><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <b>계정 선택</b><small>B:RIGHT(으)로 이동</small></div>
    <button class="acc" data-ok="1"><span class="av">김</span><span><b>김브밴</b><small>audit.kim@feedback-team.kr</small></span></button>
    <button class="acc" data-ok="0"><span class="av o">+</span><span><b>다른 계정 사용</b><small>등록되지 않은 Google 계정</small></span></button>
    <div class="pick-f"><span>시연용 화면 · 실제 Google 인증은 서버 연결 후</span><button id="cancel">취소</button></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
// 이미 로그인한 상태면 바로 첫 화면으로
try { const a = JSON.parse(sessionStorage.getItem('bright-auth') || 'null'); if (a && Date.now() - a.at < 3600e3) location.replace('start.html'); } catch (e) {}
$('gbtn').onclick = () => { $('err').textContent = ''; $('dim').classList.add('on'); };
$('cancel').onclick = () => $('dim').classList.remove('on');
$('dim').onclick = e => { if (e.target === $('dim')) $('dim').classList.remove('on'); };
addEventListener('keydown', e => { if (e.key === 'Escape') $('dim').classList.remove('on'); });
document.querySelectorAll('.acc').forEach(b => b.onclick = () => {
  $('dim').classList.remove('on');
  if (b.dataset.ok !== '1') { $('err').textContent = '등록되지 않은 계정이에요. 관리자에게 계정 등록을 요청하세요.'; return; }
  $('gbtn').classList.add('busy'); $('gbtn').lastChild.textContent = ' 로그인 중…';
  try { sessionStorage.setItem('bright-auth', JSON.stringify({name:'김브밴', email:'audit.kim@feedback-team.kr', at:Date.now()})); } catch (e) {}
  setTimeout(() => $('card').classList.add('leave'), 700);
  setTimeout(() => location.href = 'start.html?t=' + Date.now(), 1100);
});
</script>
</body>
</html>
