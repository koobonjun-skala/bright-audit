<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>/* 로그인하지 않았거나 1시간이 지나면 로그인 화면으로 */
(function(){ try { var a = JSON.parse(sessionStorage.getItem('bright-auth') || 'null'); if (!a || Date.now() - a.at >= 3600e3) { sessionStorage.removeItem('bright-auth'); location.replace('login.html'); } } catch (e) { location.replace('login.html'); } })();</script>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B:RIGHT</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="orb.js?v=1794805836"></script>
<style>
:root{--ink:#14192B;--ink-2:#5A6178;--ink-3:#9AA1B4;--blue:#2F6BFF;--sky:#00B8FF}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;overflow:hidden;color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.02em}

/* 배경 */
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;background:linear-gradient(135deg,#F3F6FD 0%,#EAF0FC 45%,#E4ECFC 100%)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px)}
.bg .a{width:780px;height:780px;right:-220px;top:-160px;background:radial-gradient(circle at 40% 40%,#B9CDFF 0%,#D3E0FF 45%,rgba(211,224,255,0) 70%);animation:drift 18s ease-in-out infinite alternate}
.bg .b{width:640px;height:640px;left:-200px;bottom:-280px;background:radial-gradient(circle,#CFDDFF 0%,rgba(207,221,255,0) 70%);animation:drift 22s ease-in-out infinite alternate-reverse}
.bg .c{width:420px;height:420px;left:46%;top:58%;background:radial-gradient(circle,#DCE6FF 0%,rgba(220,230,255,0) 70%)}
.bg .s1,.bg .s2{position:absolute;filter:blur(30px);transform:rotate(-32deg)}
.bg .s1{width:1400px;height:170px;left:-200px;top:300px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.85) 45%,rgba(255,255,255,0))}
.bg .s2{width:1200px;height:90px;left:200px;top:120px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.6) 50%,rgba(255,255,255,0))}
@keyframes drift{to{transform:translate(-40px,30px) scale(1.06)}}

header{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:30px 44px}
.logo{font-size:23px;font-weight:900;letter-spacing:-.03em;color:var(--ink);text-decoration:none}
.logo span{color:var(--blue)}
.menu{display:grid;grid-template-columns:repeat(3,5px);gap:4px;padding:6px}
.menu i{width:5px;height:5px;border-radius:50%;background:var(--ink)}

main{position:relative;z-index:2;max-width:1000px;margin:0 auto;padding:11vh 24px 0}

/* 제목: 한 줄, 검정, 타이핑 전환 */
.kick{height:20px;margin:0 0 12px;font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--blue);transition:opacity .4s,transform .4s}
.title{height:58px;margin:0 0 14px;font-size:42px;font-weight:700;line-height:58px;letter-spacing:-.04em;color:var(--ink);white-space:nowrap}
.title .cur{display:inline-block;width:.5em;height:4px;margin-left:6px;vertical-align:baseline;background:var(--blue);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sub{height:26px;margin:0 0 34px;font-size:17px;color:var(--ink-2);transition:opacity .4s,transform .4s}
.fade{opacity:0;transform:translateY(6px)}
.pager{display:flex;gap:6px;margin:0 0 0 2px;position:absolute;top:calc(11vh + 6px);right:24px}
.pager i{width:6px;height:6px;border-radius:3px;background:#C5CFE6;transition:width .4s,background .4s}
.pager i.on{width:22px;background:var(--blue)}

/* 입력창 */
.box{position:relative;background:#fff;border-radius:20px;padding:20px 20px 16px 24px;box-shadow:0 20px 50px rgba(40,70,160,.08);outline:2px solid transparent;transition:outline-color .15s,box-shadow .2s}
.box:focus-within{box-shadow:0 20px 50px rgba(40,70,160,.12),0 0 0 4px rgba(47,107,255,.08)}
.box.drag{outline-color:var(--blue);background:#F7F9FF}
.row{display:flex;gap:10px;align-items:flex-start}
.row .orb{flex:none;width:26px;height:26px;margin-top:0}
textarea{flex:1;margin-top:1px;border:0;outline:0;resize:none;font-family:inherit;font-size:16px;font-weight:400;line-height:1.6;letter-spacing:-.02em;color:var(--ink);background:transparent;height:26px;max-height:120px;padding:0}
textarea::placeholder{color:var(--ink)}
textarea:focus::placeholder{color:transparent}
.files{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0 26px}
.files:empty{display:none}
.file{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 6px 0 10px;border-radius:8px;background:#F3F5FA;font-size:13.5px;color:var(--ink-2);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
.file em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--blue);cursor:pointer}
.file em.e{color:#14915A}
.file button{border:0;background:none;color:var(--ink-3);font-size:15px;cursor:pointer;padding:0 4px}
.bar{display:flex;align-items:center;gap:8px;margin-top:24px}
.chip{height:32px;padding:0 13px;border-radius:16px;border:1px solid #DDE2EC;background:#fff;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:border-color .2s,color .2s,background .2s}
.chip:hover{border-color:#B9C3D9;color:var(--ink)}
.chip.has{border-color:transparent;background:#EAF0FF;color:var(--blue);font-weight:600}
.chip .pl{font-style:normal}.chip.has .pl{display:none}.chip.has::before{content:"✓"}
/* 화살표: 파일이 들어갈수록 아래부터 차오른다 */
.go{position:relative;margin-left:auto;width:40px;height:40px;border:0;border-radius:50%;background:#E3E7EF;color:#fff;overflow:hidden;cursor:not-allowed;padding:0}
.go .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,var(--sky),var(--blue));transition:height .6s cubic-bezier(.3,.8,.3,1)}
.go[data-lv="1"] .fill{height:50%}
.go[data-lv="2"] .fill{height:100%}
.go svg{position:relative;z-index:1;display:block;margin:auto;transition:transform .3s}
.go.on{cursor:pointer;box-shadow:0 6px 18px rgba(47,107,255,.35);animation:ready 1.8s ease-in-out infinite}
.go.on:hover svg{transform:translateY(-2px)}
@keyframes ready{50%{box-shadow:0 6px 24px rgba(47,107,255,.55),0 0 0 6px rgba(47,107,255,.08)}}
.go.busy svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
input[type=file]{display:none}

/* 사용 순서 */
.steps{display:flex;align-items:flex-start;margin:64px 0 0}
.st{flex:none;display:flex;flex-direction:column;align-items:center;gap:16px;width:110px}
.ci{position:relative;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.55));border:1px solid rgba(255,255,255,.8);
  box-shadow:0 2px 6px rgba(6,128,249,.10),inset 0 -6px 14px rgba(170,195,245,.18);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .4s}
.ci span{position:relative;z-index:2;font-size:19px;font-weight:700;color:#1E41AD;transition:color .4s}
.ci::after{content:"";position:absolute;inset:-1px;border-radius:50%;background:linear-gradient(135deg,#00D4FF,#0095FF 50%,#1F68F9);opacity:0;transform:scale(.5);transition:opacity .45s,transform .45s cubic-bezier(.3,1.4,.5,1);box-shadow:0 10px 26px rgba(0,140,255,.35)}
.ci::before{content:"";position:absolute;inset:-11px;border-radius:50%;border:1px dashed #49BDFE;opacity:0;transform:scale(.85);transition:opacity .4s,transform .4s}
.st.done .ci span{color:#4F86F7}
.st.on .ci{transform:translateY(-2px)}
.st.on .ci::after{opacity:1;transform:scale(1)}
.st.on .ci::before{opacity:1;transform:scale(1);animation:spin 14s linear infinite}
.st.on .ci span{color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.st b{font-size:15px;font-weight:500;color:#67717E;transition:color .4s}
.st.on b{color:var(--ink);font-weight:700}
/* 연결선: 옅은 점선 트랙 + 지나간 구간은 파란 실선으로 차오름 + 흐르는 빛 */
.ln{position:relative;flex:1;height:80px}
.ln .tr{position:absolute;left:14px;right:14px;top:39.5px;height:1px;background-image:linear-gradient(90deg,#B4CCF2 50%,transparent 50%);background-size:6px 1px}
.ln .fl{position:absolute;left:14px;top:39px;height:2px;width:0;border-radius:1px;background:linear-gradient(90deg,#7FC8FF,#2F7BFF);transition:width .7s ease}
.ln.done .fl{width:calc(100% - 28px)}
.ln .dt{position:absolute;top:36.5px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #C3D8F6,0 1px 3px rgba(40,90,200,.15);transition:box-shadow .4s}
.ln .dt.l{left:6px}.ln .dt.r{right:6px}
.ln.done .dt{box-shadow:0 0 0 1px #6FB3FF,0 0 6px rgba(47,123,255,.4)}
.ln .run{position:absolute;top:37px;left:14px;width:24px;height:6px;border-radius:3px;background:radial-gradient(closest-side,rgba(47,140,255,.9),rgba(47,140,255,0));opacity:0}
.ln.next .run{animation:flow 1.6s ease-in-out infinite}
@keyframes flow{0%{left:14px;opacity:0}20%{opacity:1}80%{opacity:1}100%{left:calc(100% - 38px);opacity:0}}

/* 주화면으로 넘어가는 전환 */
.leaving main>*:not(.box),.leaving header{transition:opacity .35s ease,transform .45s ease;opacity:0;transform:translateY(-14px)}
.box.lift{transform:translateY(-6px);box-shadow:0 30px 70px rgba(40,70,160,.16);transition:transform .3s ease,box-shadow .3s ease}
.box.fly{transition:left 1s cubic-bezier(.7,0,.2,1),top 1s cubic-bezier(.7,0,.2,1),width 1s cubic-bezier(.7,0,.2,1),height 1s cubic-bezier(.7,0,.2,1),padding 1s cubic-bezier(.7,0,.2,1),border-radius 1s,box-shadow 1s,transform .4s;
  transform:none;padding:0;border-radius:24px;overflow:hidden;box-shadow:0 8px 20px rgba(30,60,170,.25)}
.box.fly textarea,.box.fly .files,.box.fly .bar{opacity:.38;filter:blur(.6px);transition:opacity .5s ease,filter .5s ease}
.box.fly .files,.box.fly .bar{flex-wrap:nowrap;white-space:nowrap}
.box.fly textarea{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box.fly .orb{width:48px;height:48px;transition:width 1s cubic-bezier(.7,0,.2,1),height 1s cubic-bezier(.7,0,.2,1)}
.box.fly .orb .orb-wave{animation-duration:1.2s}
.ghost-sb{position:fixed;z-index:40;left:16px;top:16px;bottom:16px;width:72px;border-radius:26px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);box-shadow:0 20px 50px rgba(40,70,160,.08);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);opacity:0;transform:translateX(-40px);transition:opacity .6s ease,transform .8s cubic-bezier(.3,.8,.3,1)}
.ghost-sb.in{opacity:1;transform:none}

/* 진행 중 */
.log{display:flex;flex-direction:column;gap:9px;margin:16px 0 4px 36px}
.log:empty{display:none}
.lg{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2);animation:pop .3s ease}
.lg i{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid #D3DCF0;border-top-color:var(--blue);animation:sp .8s linear infinite}
.lg.ok i{border:0;animation:none;background:linear-gradient(135deg,#00C2FF,#2F6BFF);position:relative}
.lg.ok i::after{content:"";position:absolute;left:5px;top:3.5px;width:4px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.lg.ok span{color:var(--ink)}
.lg b{margin-left:auto;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.box.running .bar{display:none}
.box.running .files{opacity:.55}
.box.running textarea::placeholder{color:var(--ink-2)}
.running .st{cursor:default}
.ci .ring{position:absolute;inset:-7px;width:94px;height:94px;transform:rotate(-90deg);pointer-events:none;opacity:0;transition:opacity .3s}
.ci .ring circle{fill:none;stroke:url(#none);stroke:#2F7BFF;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:295.3;stroke-dashoffset:295.3;transition:stroke-dashoffset .12s linear}
.st.run .ci .ring{opacity:1}
.st.run .ci{transform:translateY(-2px);box-shadow:0 8px 24px rgba(47,107,255,.18)}
.st.run b,.st.ok b{color:var(--ink);font-weight:700}
.st.ok .ci::after{opacity:1;transform:scale(1)}
.st.ok .ci span{color:#fff;font-size:22px}
.st.ok .ci .ring{opacity:0}
.cap{height:18px;margin-top:-8px;font-size:12.5px;font-weight:600;color:var(--blue);white-space:nowrap;font-variant-numeric:tabular-nums}
.box.fly .log{opacity:.38;filter:blur(.6px);transition:opacity .5s,filter .5s}
#toast{position:fixed;left:50%;bottom:32px;z-index:60;transform:translate(-50%,12px);padding:11px 18px;border-radius:12px;background:rgba(20,25,43,.9);color:#fff;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:760px){header{padding:20px 18px} .title{font-size:26px} .ln{display:none} .steps{flex-wrap:wrap;gap:18px;justify-content:center}}
</style>
</head>
<body>
<div class="bg"><i class="a"></i><i class="b"></i><i class="c"></i><i class="s1"></i><i class="s2"></i></div>

<header>
  <a class="logo" href="start.html">B<span>:</span>RIGHT</a>
  <a class="menu" href="main.html" aria-label="메뉴"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></a>
</header>

<main>
  <p class="kick" id="kick"></p>
  <h1 class="title" aria-live="polite"><span id="tt"></span><span class="cur"></span></h1>
  <p class="sub" id="sub"></p>

  <section class="box" id="box">
    <div class="row">
      <span class="orb" id="orb" data-orb></span>
      <textarea id="q" rows="1" placeholder="B:RIGHT입니다. 정책 파일과 집행내역을 올려 감사를 시작하세요."></textarea>
    </div>
    <div class="files" id="files"></div>
    <div class="bar">
      <button class="chip" id="pickP" type="button"><i class="pl">＋</i> 정책 파일</button>
      <button class="chip" id="pickE" type="button"><i class="pl">＋</i> 지급내역</button>
      <button class="go" id="go" type="button" aria-label="감사 시작" data-lv="0" disabled>
        <span class="fill"></span>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
    </div>
    <input type="file" id="inP" multiple>
    <input type="file" id="inE" multiple>
  </section>

  <section class="steps" id="steps" aria-label="사용 순서"></section>
</main>

<script>
const $ = id => document.getElementById(id);

/* ── 제목 3개 타이핑 전환 */
const SLIDES = [
  { k: 'FEE AUDIT AGENT', t: '수수료 감사, 누구나 쉽고 정확하게', s: '정책대로 지급됐는지, 근거 조항까지 보여 드려요.' },
  { k: 'AUDIT INNOVATION', t: '감사의 혁신, B:RIGHT', s: '정책 문서와 지급내역만 올리면 감사가 시작돼요.' },
  { k: 'BEYOND MATCHING', t: '대조와 검증, 그 외의 눈으로 찾기 어려운 현상까지', s: '건별 대조를 넘어, 모아 봐야 보이는 패턴도 짚어 드려요.' },
];
const wait = ms => new Promise(r => setTimeout(r, ms));
let typing = true;
async function typeLoop(){
  let i = 0;
  while (typing){
    const sl = SLIDES[i];
    $('kick').textContent = sl.k; $('sub').textContent = sl.s;
    $('kick').classList.remove('fade'); $('sub').classList.remove('fade');
    for (let n = 1; n <= sl.t.length; n++){ if (!typing) return; $('tt').textContent = sl.t.slice(0, n); await wait(70); }
    await wait(3200); if (!typing) return;
    $('kick').classList.add('fade'); $('sub').classList.add('fade');
    for (let n = sl.t.length; n >= 0; n--){ if (!typing) return; $('tt').textContent = sl.t.slice(0, n); await wait(28); }
    await wait(350);
    i = (i + 1) % SLIDES.length;
  }
}
$('kick').classList.add('fade'); $('sub').classList.add('fade');
typeLoop();

/* ── 입력창: 클릭하면 입력, 비우면 안내 문장이 다시 보임 (placeholder) */
const q = $('q');
q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 120) + 'px'; });
q.addEventListener('blur', () => { if (!q.value.trim()){ q.value = ''; q.style.height = '26px'; } });
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('go').click(); } });

/* ── 파일 */
const files = [];
const kindOf = n => /\.(docx?|pdf)$/i.test(n) || /정책|policy/i.test(n) ? 'p' : 'e';
function add(list, kind){
  for (const f of list){
    if (!/\.(docx?|xlsx|xlsb|xlsm|xls|csv|pdf)$/i.test(f.name)){ toast(`${f.name} · Word, Excel, CSV, PDF만 올릴 수 있어요`); continue; }
    if (f.size >= 50 * 1024 * 1024){ toast(`${f.name} · 50MB 미만 파일만 올릴 수 있어요`); continue; }
    if (!files.some(x => x.f.name === f.name)) files.push({ f, k: kind || kindOf(f.name) });
  }
  render();
}
function toast(t){
  let el = document.getElementById('toast');
  if (!el){ el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = t; el.className = 'show'; clearTimeout(el._t); el._t = setTimeout(() => el.className = '', 2600);
}
function render(){
  $('files').innerHTML = '';
  files.forEach((x, i) => {
    const el = document.createElement('span'); el.className = 'file';
    el.innerHTML = `<em class="${x.k}" title="눌러서 종류 바꾸기">${x.k === 'p' ? '정책' : '지급'}</em><span></span><button aria-label="삭제">×</button>`;
    el.children[1].textContent = x.f.name;
    el.children[0].onclick = () => { x.k = x.k === 'p' ? 'e' : 'p'; render(); };
    el.children[2].onclick = () => { files.splice(i, 1); render(); };
    $('files').appendChild(el);
  });
  const p = files.some(x => x.k === 'p'), e = files.some(x => x.k === 'e');
  $('pickP').classList.toggle('has', p); $('pickE').classList.toggle('has', e);
  $('go').dataset.lv = (p ? 1 : 0) + (e ? 1 : 0);
  $('go').disabled = !(p && e); $('go').classList.toggle('on', p && e);
}
$('pickP').onclick = () => $('inP').click();
$('pickE').onclick = () => $('inE').click();
$('inP').onchange = e => { add(e.target.files, 'p'); e.target.value = ''; };
$('inE').onchange = e => { add(e.target.files, 'e'); e.target.value = ''; };
let depth = 0; const box = $('box');
addEventListener('dragenter', e => { e.preventDefault(); depth++; box.classList.add('drag'); });
addEventListener('dragleave', () => { if (!--depth) box.classList.remove('drag'); });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); depth = 0; box.classList.remove('drag'); add(e.dataTransfer.files); });

/* ── 사용 순서 5단계 */
const NAMES = ['파일 올리기', '정책 분석', '금액 대조', '결과 확인', '근거 확인'];
$('steps').innerHTML = NAMES.map((n, i) =>
  `<div class="st"><div class="ci"><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47"/></svg><span>0${i + 1}</span></div><b>${n}</b><small class="cap"></small></div>` +
  (i < 4 ? '<div class="ln"><i class="tr"></i><i class="fl"></i><i class="run"></i><i class="dt l"></i><i class="dt r"></i></div>' : '')).join('');
const sts = [...document.querySelectorAll('.st')], lns = [...document.querySelectorAll('.ln')];
function mark(i){
  sts.forEach((s, j) => { s.classList.toggle('on', j === i); s.classList.toggle('done', j < i); });
  lns.forEach((l, j) => { l.classList.toggle('done', j < i); l.classList.toggle('next', j === i); });
}
let cur = 0; mark(0);
let auto = setInterval(() => mark(cur = (cur + 1) % sts.length), 2400);
sts.forEach((s, i) => s.onmouseenter = () => { clearInterval(auto); mark(cur = i); });
$('steps').onmouseleave = () => { clearInterval(auto); auto = setInterval(() => mark(cur = (cur + 1) % sts.length), 2400); };

/* ── 감사 진행: 단계 동그라미와 입력창 기록으로 진행 상황을 보여 준다
   숫자는 미리 계산해 둔 실데이터 결과(dash.html과 같은 값). 실제 연결 시 AI 서버의 job-events로 바꾼다 */
const RESULT = { total: 2508, over: 49, under: 19, check: 171 };
const nf = n => n.toLocaleString('ko-KR');
function logLine(text){
  const el = document.createElement('div'); el.className = 'lg';
  el.innerHTML = '<i></i><span></span><b></b>'; el.children[1].textContent = text;
  return el;   // 입력창에는 기록을 띄우지 않고, 진행은 아래 동그라미로만 보여 준다
}
const done = (el, val) => { el.classList.add('ok'); if (val != null) el.children[2].textContent = val; };
function setStep(i, pct, cap){
  const s = sts[i]; s.classList.add('run');
  s.querySelector('.ring circle').style.strokeDashoffset = 295.3 * (1 - pct);
  if (cap != null) s.querySelector('.cap').textContent = cap;
}
function finishStep(i, cap){
  const s = sts[i]; setStep(i, 1, cap);
  s.classList.remove('run'); s.classList.add('ok'); s.querySelector('span').textContent = '✓';
  if (lns[i]) lns[i].classList.add('done');
}
async function count(ms, fn){ const t0 = performance.now(); for (;;){ const k = Math.min(1, (performance.now() - t0) / ms); fn(k); if (k >= 1) return; await wait(40); } }
async function runAudit(){
  typing = false; clearInterval(auto);
  sts.forEach(s => s.onmouseenter = null); $('steps').onmouseleave = null;
  sts.forEach(s => s.classList.remove('on', 'done')); lns.forEach(l => l.classList.remove('done', 'next'));
  document.body.classList.add('running'); box.classList.add('running'); $('orb').classList.add('busy');
  $('kick').textContent = 'AUDIT IN PROGRESS'; $('kick').classList.remove('fade');
  $('tt').textContent = '감사를 진행하고 있어요'; $('sub').textContent = '정책을 읽고, 지급내역과 하나씩 대조하고 있어요.'; $('sub').classList.remove('fade');
  q.value = ''; q.placeholder = 'B:RIGHT가 감사를 진행하고 있어요.'; q.disabled = true;
  const p = files.filter(x => x.k === 'p').length, e = files.length - p;

  let l = logLine('올린 파일 확인'); setStep(0, 0, '확인 중');
  await count(700, k => setStep(0, k)); done(l, `정책 ${p} · 지급내역 ${e}`); finishStep(0, `${files.length}개 파일`);

  l = logLine('정책 문서 읽기 · 지급 조건·단가·기간 정리'); setStep(1, 0, '0%');
  await count(2200, k => setStep(1, k, Math.round(k * 100) + '%')); done(l, '완료'); finishStep(1, '규칙 정리 완료');

  l = logLine('정책상 지급액 계산 · 실제 지급액과 대조');
  await count(2600, k => { const n = Math.round(RESULT.total * k); setStep(2, k, `${nf(n)} / ${nf(RESULT.total)}건`); l.children[2].textContent = `${nf(n)}건`; });
  done(l, `${nf(RESULT.total)}건`); finishStep(2, `${nf(RESULT.total)}건 대조`);

  l = logLine('결과 분류'); setStep(3, 0, '분류 중');
  await count(1100, k => setStep(3, k)); done(l, `과다 ${RESULT.over} · 과소 ${RESULT.under} · 확인 필요 ${RESULT.check}`);
  finishStep(3, `위반 ${RESULT.over + RESULT.under}건`);

  l = logLine('근거 조항 연결'); setStep(4, 0, '연결 중');
  await count(900, k => setStep(4, k)); done(l, '완료'); finishStep(4, '원문 위치 연결');

  $('kick').textContent = 'COMPLETE'; $('tt').textContent = '감사가 끝났어요'; $('sub').textContent = '대시보드에서 결과를 확인하세요.';
  $('orb').classList.remove('busy'); q.placeholder = '감사가 끝났어요. 대시보드로 이동할게요.';
  await wait(1100);
  fly();
}
$('go').onclick = () => {
  if ($('go').disabled) return;
  $('go').disabled = true;
  try { sessionStorage.setItem('bright-files', JSON.stringify(files.map(x => ({ n: x.f.name, k: x.k })))); } catch (e) {}
  runAudit();
};
/* ── 끝나면 입력창이 떠올랐다가 왼쪽 아래 도우미 자리로 줄어들며 이동 */
function fly(){
  const r = box.getBoundingClientRect();
  const L = 31, W = 48, H = 48, T = innerHeight - 79;   // 주화면 사이드바의 구슬 버튼 자리
  document.body.classList.add('leaving');
  const sb = document.createElement('div'); sb.className = 'ghost-sb'; document.body.appendChild(sb);
  // 사이드바보다 위로 오도록 입력창을 body 바로 아래로 옮긴다 (main 안에 있으면 사이드바 뒤로 숨음)
  const ph = document.createElement('div'); ph.style.height = r.height + 'px'; box.before(ph);
  document.body.appendChild(box);
  Object.assign(box.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', margin: 0, zIndex: 50 });
  box.classList.add('lift');
  setTimeout(() => sb.classList.add('in'), 180);
  setTimeout(() => {
    box.classList.add('fly');
    Object.assign(box.style, { left: L + 'px', top: T + 'px', width: W + 'px', height: H + 'px' });
  }, 320);
  setTimeout(() => location.href = 'main.html?from=start&t=' + Date.now(), 1420);
}
</script>
